name: 국내 전 종목 + 대가 포트폴리오 갱신

on:
  schedule:
    - cron: "30 23 * * *"   # 매일 한국시간 오전 8시 30분 (ARK 일일 내역 + 13F·트럼프 새 공시 확인)
    - cron: "30 11 * * 1-5" # 평일 한국시간 오후 8시 30분 (미국 장 시작 전 한 번 더)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-portfolios
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 국내 전 종목 일봉 (무료 marcap 데이터)
        run: python build_kr.py
      - name: 미국 주요 종목 일봉 (검색 차트용)
        run: python build_us.py
        continue-on-error: true
      - name: 기본적 분석 지표 (PER·ROE 등)
        run: python build_fund.py
        continue-on-error: true
      - name: 종목 추천 후보 (기술 + 가치 + 뉴스)
        run: node build_picks.mjs
        continue-on-error: true
      - name: 포트폴리오 데이터 받기
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python fetch_portfolios.py
      - name: 변경된 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/portfolios.json docs/kr data/cusip_map.json
          if [ -d docs/us ]; then git add docs/us; fi
          for f in docs/fund.json docs/picks.json data/fund_log.txt; do if [ -f "$f" ]; then git add "$f"; fi; done
          if [ -f data/ark_last.json ]; then git add data/ark_last.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "kr+portfolios: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
