name: 시세 데이터 갱신

on:
  schedule:
    - cron: "*/10 0-6 * * 1-5"    # 한국 장중(평일 오전 9시~오후 4시)엔 10분마다
    - cron: "*/10 13-20 * * 1-5"  # 미국 정규장(한국 시각 밤 10시~새벽 6시)엔 10분마다
    - cron: "15,45 * * * *"       # 그 밖에는 30분마다 (GitHub 사정으로 몇 분 늦어질 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch_data.py
      - name: 현재가 묶음 (국내 전 종목 + 미국 주요 종목)
        run: python build_quotes.py
        continue-on-error: true
      - name: 변경된 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if [ -f docs/quotes.json ]; then git add docs/quotes.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
