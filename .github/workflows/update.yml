name: 시세 데이터 갱신

# GitHub의 예약 실행(cron)은 사용량이 많을 때 20~50분씩 밀리거나 건너뛰어요.
# 그래서 장중에는 한 번 시작된 작업이 끝나지 않고 '10분마다 직접' 갱신을 반복하고,
# 5시간 반쯤 지나면 자기 자신을 다시 실행해 이어 달려요. 장이 닫히면 한 번만 갱신하고 끝나요.
on:
  schedule:
    - cron: "45,55 23 * * 0-4"   # 한국 장 시작 전(08:45, 08:55)에 반복 작업 시작
    - cron: "20,25 13 * * 1-5"   # 미국 장 시작 전(22:20, 22:25)에 반복 작업 시작
    - cron: "*/20 * * * *"       # 반복 작업이 어떤 이유로 끊겼을 때 다시 살리는 예비(장 밖에선 1회 갱신)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 장중 10분마다 갱신 반복
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          market_open() {
            python - <<'PY'
          from datetime import datetime, timezone, timedelta
          u = datetime.now(timezone.utc); k = u + timedelta(hours=9)
          kr = k.weekday() < 5 and (8, 50) <= (k.hour, k.minute) <= (15, 50)
          # 미국 정규장(서머타임 13:30~20:00 / 겨울 14:30~21:00 UTC)을 넉넉히 덮음
          us = u.weekday() < 5 and (13, 20) <= (u.hour, u.minute) <= (21, 10)
          raise SystemExit(0 if (kr or us) else 1)
          PY
          }
          END=$(( $(date +%s) + 330*60 ))
          n=0
          while :; do
            t0=$(date +%s); n=$((n+1))
            echo "::group::갱신 $n ($(TZ=Asia/Seoul date '+%H:%M'))"
            python fetch_data.py || echo "fetch_data 실패"
            python build_quotes.py || echo "build_quotes 실패"
            git add docs/data.json docs/quotes.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -qm "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
              for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && break; sleep 7; done
            fi
            echo "::endgroup::"
            market_open || { echo "장 마감 — 종료"; break; }
            if [ $(date +%s) -gt $END ]; then
              echo "시간 한도 — 새 작업으로 이어 달리기"
              gh workflow run update.yml --ref main -R "$GITHUB_REPOSITORY" || true
              break
            fi
            # 다음 갱신까지 대기 (시작 기준 10분 간격)
            wait=$(( 600 - ($(date +%s) - t0) )); [ $wait -gt 0 ] && sleep $wait
            git pull -q --rebase -X theirs || true
          done
